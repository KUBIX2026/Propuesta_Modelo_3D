<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor 3D - Consola PRISMA-4X</title>
    <!-- Script necesario para que funcione model-viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background-color: #24292e; /* Color oscuro estilo GitHub */
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
        }
        model-viewer { 
            width: 100%; 
            height: 100vh; 
            background-color: #24292e; 
        }
    </style>
</head>
<body>
    <!-- Etiqueta del modelo 3D con controles y auto-rotación -->
    <model-viewer 
        src="./Propuesta_Modelo_3D/Propuesta_Modelo_3D/Modelo_Carcasa_Completo.glb" 
        camera-controls 
        auto-rotate 
        shadow-intensity="1">
    </model-viewer>
</body>
</html>
